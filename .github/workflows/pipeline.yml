name: pipeline
run-name: CI/CD was activated by ${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
permissions:
    contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
        - name: Get proj from repo
          uses: actions/checkout@v4

        - name: Setup .NET 
          uses: actions/setup-dotnet@v4
          with: 
            dotnet-version: '9.0.x'
              
        - name: Build Stage
          run: dotnet build --configuration Release
        
        - name: Testing stage
          run: dotnet test --no-build --configuration Release
  
  docker-stage:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
        - name: Get proj from repo
          uses: actions/checkout@v4

        - name: Build docker image
          run: docker compose --env-file .env.ci up -d --build --wait
         
        - name: Show containers
          if: always()
          run: docker compose --env-file .env.ci ps

        - name: Show logs if failed
          if: failure()
          run: docker compose --env-file .env.ci logs

        - name: Cleanup
          if: always()
          run: docker compose --env-file .env.ci down -v

  publish-stage:
    needs: docker-stage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions:
        contents: read
        packages: write
    
    steps:
        - name: Get proj from repo
          uses: actions/checkout@v4

        - name: Setup docker buildx
          uses: docker/setup-buildx-action@v3
        
        - name: Prepare image name
          run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        
        - name: Login to GHCR   
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }} 

        - name: Extract docker meta
          id: meta
          uses: docker/metadata-action@v5
          with: 
            images: ${{ env.IMAGE_NAME }}
            tags: |
                type=raw,value=latest
                type=sha

        - name: Build and Push
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
 
  prod-stage:
    needs: publish-stage
    runs-on: ubuntu-latest

    steps:
    - name: Run container
      run: |
        docker run -d \
        --name todoapi \
        -p 8080:8080 \
        ghcr.io/heckerman2281337/todoapi-omgsocreative-:latest